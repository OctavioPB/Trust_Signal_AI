name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Python: unit tests + coverage ────────────────────────────────────────────
  python-tests:
    name: Python tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Unit tests inject model stubs; never download models in CI.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install "pytest>=8.1.0" "pytest-asyncio>=0.23.0" "pytest-cov>=5.0.0" "faker>=24.0.0" "hypothesis>=6.100.0"

      - name: Run unit tests with coverage
        run: |
          pytest --cov --cov-report=xml --cov-report=html --cov-report=term \
                 --junitxml=pytest-results.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "## Python coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage & test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            coverage.xml
            htmlcov/
            pytest-results.xml
          retention-days: 14

  # ── Detection evaluation gate ───────────────────────────────────────────────
  # Scores the labelled evaluation set (evals/) with every text signal and fails
  # if AUROC, TPR at 1% FPR, or any human group's flag rate regresses vs
  # evals/baseline.json. Models and pinned datasets are cached between runs.
  detection-eval:
    name: Detection evaluation gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-distilgpt2-minilm-smollm2-135m-v1

      - name: Cache pinned evaluation sources
        uses: actions/cache@v4
        with:
          path: evals/data/cache
          key: eval-sources-${{ hashFiles('evals/build_dataset.py') }}

      - name: Build evaluation set (pinned + checksummed)
        run: python -m evals.build_dataset

      - name: Score and gate against baseline
        run: python -m evals.run --check

      - name: Sequential early-detection gate
        run: python -m evals.sequential --check

      - name: Evaluation summary
        if: always()
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, pathlib
          p = pathlib.Path("evals/results/latest.json")
          if not p.exists():
              raise SystemExit(0)
          r = json.loads(p.read_text())
          print("## Detection evaluation")
          print(f"{r['dataset']['n']} texts · fingerprint `{r['dataset']['fingerprint']}`\n")
          print("| Scorer | AUROC | TPR @ 1% FPR | Non-native flag rate | Native flag rate |")
          print("|---|---|---|---|---|")
          for k, m in r["scorers"].items():
              g = m["group_flag_rate_at_5pct_fpr"]
              print(f"| {k} | {m['auroc']} | {m['tpr_at_1pct_fpr']} | "
                    f"{g.get('non_native_essay')} | {g.get('native_essay')} |")
          print("\nGroup flag rates are read at the threshold giving 5% FPR overall.")
          EOF

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-eval
          path: |
            evals/results/latest.json
            evals/results/sequential.json
          retention-days: 30

  # ── PII audit (CLAUDE.md Hard Rule #6) ───────────────────────────────────────
  pii-audit:
    name: PII audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Tests are skipped: they contain PII-shaped fixtures to assert PII is *absent*.
      - run: python scripts/pii_audit.py --path . --skip-dir tests

  # ── Frontend: typecheck/build + unit tests + coverage ────────────────────────
  frontend:
    name: Frontend build, tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck & build
        run: npm run build

      - name: Unit tests with coverage
        run: npx vitest run --coverage --coverage.reporter=text --coverage.reporter=json-summary --coverage.reporter=html

      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = k => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["## Frontend coverage", "| Metric | % | Covered |", "|---|---|---|",
              ...["lines","statements","functions","branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (demo mode, no backend)
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  # ── Python lint ──────────────────────────────────────────────────────────────
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned: new ruff releases add rules; bump deliberately (and in .pre-commit-config.yaml).
      - run: pip install "ruff==0.9.10"
      - run: ruff check . --output-format=github
