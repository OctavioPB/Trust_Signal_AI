[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "trustsignal"
version = "0.1.0"
description = "AI-powered interview authenticity scoring platform"
requires-python = ">=3.11"
readme = "README.md"

# ── Ruff (linter) ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "S",   # bandit security
    "B",   # flake8-bugbear
]
ignore = [
    "S101",  # assert allowed in tests
    "S105",  # possible hardcoded password (triggers on placeholder defaults)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# Legacy Streamlit dashboard: long inline HTML/CSS strings; superseded by frontend/.
"dashboard/legacy/**" = ["E501"]

# ── PII audit ─────────────────────────────────────────────────────────────────
# Run:  python scripts/pii_audit.py
# CI:   python scripts/pii_audit.py --path . ; exit code 1 = findings
# Ruff does not ship a built-in PII rule; the custom script above covers it.
# The S (bandit) rule-set guards against hardcoded passwords and common secrets.

# ── Black (formatter) ─────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--tb=short"

# ── Coverage ──────────────────────────────────────────────────────────────────
# Run:  pytest --cov --cov-report=term-missing
[tool.coverage.run]
source = ["ml", "ingestion", "api", "storage", "transcription", "airflow", "dashboard"]
omit = ["*/__init__.py", "dashboard/legacy/*"]

[tool.coverage.report]
# Ratchet: floor at the current baseline; raise it as coverage grows.
# Target per CLAUDE.md §6 is ≥ 80 % for ml/ and ingestion/.
fail_under = 60
show_missing = true
skip_covered = true
